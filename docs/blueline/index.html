.alpha { background: linear-gradient(90deg, transparent, var(--c)), repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0 / 8px 8px; }
.hue i, .alpha i { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); transform: translate(-50%, -50%); pointer-events: none; }
.gbar { position: relative; height: 18px; border-radius: 5px; background: var(--g), repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0 / 8px 8px; margin: 6px 7px 4px; cursor: copy; }
.gstop { position: absolute; top: -4px; width: 14px; height: 26px; transform: translateX(-50%); border-radius: 4px; border: 2px solid #fff; background: var(--c); box-shadow: 0 0 0 1px rgba(0,0,0,.3); cursor: ew-resize; }

.pkdoc { display: flex; flex-wrap: wrap; gap: 5px; padding-top: 4px; border-top: 1px solid var(--line); }

/* ---------- modal ---------- */

.modal.wide #modalBody { width: min(820px, 100%); }

.lead { color: var(--fg2); font-size: 13px; line-height: 1.55; margin: 0 0 12px; max-width: 62ch; }

/* ---------- present ---------- */

.pbar { display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px; }

.player { position: absolute; inset: 0; display: grid; place-items: center; }

@keyframes pslideL { from { transform: translateX(100%); } }
@keyframes pslideR { from { transform: translateX(-100%); } }
@keyframes pslideU { from { transform: translateY(100%); } }
@keyframes poutL { to { transform: translateX(-30%); opacity: 0; } }
@keyframes poutR { to { transform: translateX(30%); opacity: 0; } }

#toast { position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%); z-index: 95; background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-weight: 500; box-shadow: var(--shadow); max-width: calc(100% - 32px); transition: opacity .2s, transform .2s; }

/* ---------- narrow screens ---------- */

  #app { grid-template-columns: 0 minmax(0, 1fr) 0; }

  #right { right: 0; transform: translateX(105%); }

  .ptoggle { display: inline-grid; }
  #saveBadge, .hide-sm { display: none; }
  #fileName { width: 36vw; }
  #toolbar { max-width: calc(100% - 24px); overflow-x: auto; }
  .cogrid { grid-template-columns: 1fr; }
}

/* ---------- AI panel ---------- */
.aibtn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 8px; border: 1px solid var(--line2); border-radius: 14px; background: var(--bg); color: var(--fg2); font-weight: 600; position: relative; }

.aihead { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding-right: 6px; }

.aibody { overflow: auto; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 8px; }

.aistatus { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 8px; background: var(--bg2); }

.aistatus[data-state="connecting"] i, .aistatus[data-state="reconnecting"] i { background: var(--warn); }
.aistatus[data-state="error"] i, .aistatus[data-state="blocked"] i { background: var(--danger); }
.aistatus b { display: block; }
.fl { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fl > span { font-weight: 600; color: var(--fg2); font-size: 11.5px; }
.hexlike { height: 28px; border: 1px solid transparent; border-radius: 6px; background: var(--bg2); padding: 0 8px; font: 12px var(--mono); min-width: 0; width: 100%; outline: none; }
.hexlike:focus { border-color: var(--sel); background: var(--bg); }
.hexlike:disabled { opacity: .6; }
.fl .row .hexlike { flex: 1; }
.peerlist { display: flex; flex-direction: column; gap: 6px; }
.peer { display: flex; gap: 8px; align-items: center; }
.peer .av { margin: 0; border: 0; }
.peer b { display: block; }
.peer.gone { opacity: .5; }
.codebox { position: relative; }
.codebox pre { margin: 0; padding: 10px; padding-right: 64px; background: var(--bg2); border-radius: 8px; font: 11px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; }
.codebox .tb { position: absolute; top: 6px; right: 6px; }
.facts.sm { font-size: 11.5px; line-height: 1.6; margin: 0; padding-left: 16px; }
.facts code, .tooldoc code { font: 11px var(--mono); background: var(--bg2); padding: 1px 4px; border-radius: 4px; }
.chatlog { display: flex; flex-direction: column; gap: 8px; max-height: 260px; min-height: 80px; overflow: auto; padding: 4px 2px; }
.msg { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 10px; background: var(--bg2); max-width: 92%; }
.msg.me { align-self: flex-end; background: color-mix(in srgb, var(--sel) 14%, var(--bg)); }
.msg b { font-size: 11px; color: var(--fg2); }
.msg span { white-space: pre-wrap; word-break: break-word; }
.chatform { display: flex; gap: 6px; }
.chatform input { flex: 1; min-width: 0; height: 30px; border: 1px solid var(--line2); border-radius: 6px; padding: 0 8px; background: var(--bg); outline: none; }
.chatform input:focus { border-color: var(--sel); }
.actlog { display: flex; flex-direction: column; gap: 4px; }
.act { display: grid; grid-template-columns: auto auto 1fr; gap: 8px; align-items: baseline; font-size: 11.5px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.act .mono { color: var(--fg3); font-size: 10.5px; }
.act.bad b { color: var(--danger); }

.exai { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
.exai > div:first-child { min-width: 0; }

.excode { font: 600 18px var(--mono); color: var(--fg2); }
#overlay .aiflash { fill: none; stroke-width: 2; stroke-dasharray: 5 3; }

/* OfficeNinja integration: scoped to the suite navigation and editor height. */
#suiteNav { height: 42px; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--bg2); border-bottom: 1px solid var(--line); }

#app { height: calc(100% - 42px); }

@media (max-width: 860px) { #left, #right { top: 86px; } }

@media (max-width: 600px) {

<body>
<nav id="suiteNav" aria-label="OfficeNinja apps">

  </select>

</nav>
<div id="app">
  <header id="topbar">
    <button class="ib ptoggle" data-panel-toggle="left" title="Layers"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>

      <button class="ib ptoggle" data-panel-toggle="right" title="Properties"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
    </div>

  <aside id="left">
    <div class="tabs"><button data-ltab="layers" class="on">Layers</button><button data-ltab="assets">Assets</button></div>

      <div class="phead"><span>Layers</span></div>
      <div id="layerTree"></div>
    </div>

      <div class="searchbox"><input id="assetSearch" placeholder="Search components" spellcheck="false" autocomplete="off"></div>
      <div id="assetList"></div>
    </div>
  </aside>
  <main id="stage" data-tool="move">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"><g id="vp"><g id="content"></g></g></svg>

      <button data-tool="frame" title="Frame (F)"></button>

      <button data-tool="pen" title="Pen (P)"></button>
      <button data-tool="pencil" title="Pencil (Shift+P)"></button>
      <button data-tool="text" title="Text (T)"></button>
    </div>
  </main>
  <aside id="right">
    <div class="tabs"><button data-rtab="design" class="on">Design</button><button data-rtab="prototype">Prototype</button></div>
    <div id="designPane"></div>
  </aside>
</div>
<div id="menu" hidden></div>
<div id="submenu" hidden></div>

<div id="fontpop" class="popover" hidden></div>

  <div class="pbar"><button class="tb" id="pback" disabled>← Back</button><button class="tb" id="prestart">Restart</button><span id="ptitle"></span><button class="tb" id="pclose">Close <kbd>Esc</kbd></button></div>
  <div id="pstage"></div>
</div>

<script>
'use strict';
/* ============================================================
   Blueline — utilities: ids, math, matrices, colors, DOM helpers
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

function onKeyDown(e) {

    if (code === 'KeyG') return run(() => alt ? cmdFrameSelection() : sh ? cmdUngroup() : (cmdGroup() && commit('Group')));
    if (code === 'KeyK' && alt) return run(cmdCreateComponent);
    if (code === 'KeyK' && sh) return run(placeImage);
    if (code === 'KeyB' && alt) return run(cmdDetach);
    if (code === 'KeyM' && alt) return run(cmdMask);
    if (code === 'KeyE' && sh) return run(exportSelection);
    if (code === 'KeyE') return run(cmdFlatten);
    if (code === 'KeyA') return run(cmdSelectAll);
    if (code === 'KeyH' && sh) return run(() => cmdToggle('visible'));
    if (code === 'KeyL' && sh) return run(() => cmdToggle('locked'));

    if (code === 'BracketLeft') return run(() => cmdZ(alt ? 'back' : 'backward'));

    const al = { KeyA: 'left', KeyD: 'right', KeyW: 'top', KeyS: 'bottom', KeyH: 'hcenter', KeyV: 'vcenter' }[code];

  }

    if (code === 'KeyA') return run(cmdAutoLayout);

    if (code === 'KeyV') return run(() => cmdFlip('v'));
    if (code === 'KeyL') return run(() => setTool('arrow'));
    if (code === 'KeyP') return run(() => setTool('pencil'));
    if (code === 'Digit1') return run(zoomToFit);
    if (code === 'Digit2') return run(zoomToSelection);
    if (code === 'Digit0') return run(() => { updateStageRect(); zoomAt(stageRect.width / 2, stageRect.height / 2, 1); });

/* ---------- export ---------- */
async function exportSelection() {
  let ids = topSelection(D.sel.filter(id => N(id)));
  if (!ids.length) { ids = kids(pageNode()).filter(n => isFrameLike(n) && n.visible).map(n => n.id); if (!ids.length) return toast('Select something to export'); }
  openModal(`<h2>Export</h2><div class="exlist"><div class="hint">Rendering…</div></div>`, 'wide');
  const out = [];
  for (const id of ids) {
    const n = N(id); const settings = (n.exportSettings && n.exportSettings.length) ? n.exportSettings : [{ scale: 2, format: 'PNG' }];
    for (const s of settings) {
      const base = n.name.replace(/[\\/:*?"<>|]+/g, '-') + (s.scale !== 1 && s.format !== 'SVG' ? `@${s.scale}x` : '');
      try {
        if (s.format === 'HTML' || s.format === 'JSON') {
          const text = s.format === 'HTML' ? htmlExport(id).html : JSON.stringify({ format: 'blueline-spec', version: 1, layers: [nodeToSpec(n)] }, null, 1);
          const blob = new Blob([text], { type: s.format === 'HTML' ? 'text/html' : 'application/json' });
          out.push({ name: n.name.replace(/[\\/:*?"<>|]+/g, '-') + (s.format === 'HTML' ? '.html' : '.spec.json'), blob, text, kind: s.format, dims: `${(text.length / 1024).toFixed(1)} KB of ${s.format === 'HTML' ? 'HTML' : 'JSON'}` });
          continue;
        }
        if (s.format === 'SVG') {
          const css = await embedFontCSS(buildSVG([id]).fams, false);
          const svg = buildSVG([id], { fontCSS: css }).svg;
          const blob = new Blob([svg], { type: 'image/svg+xml' });
          out.push({ name: base + '.svg', blob, url: URL.createObjectURL(blob), svg, dims: `${fmt(exportBounds([id]).w)}×${fmt(exportBounds([id]).h)}` });
        } else {
          const r = await rasterize([id], s.scale, s.format === 'JPG' ? 'jpg' : 'png');
          out.push({ name: base + (s.format === 'JPG' ? '.jpg' : '.png'), blob: r.blob, url: URL.createObjectURL(r.blob), dims: `${r.w}×${r.h}` });
        }
      } catch (e) { console.error(e); out.push({ name: base, err: true }); }
    }
  }

  const list = $('#modalBody .exlist'); if (!list) return;

async function aiRegisterWebMCP() {
  const mc = (typeof document !== 'undefined' && document.modelContext) || navigator.modelContext;
  if (!mc) { RC.webmcp = 'unavailable'; return; }
  const viaDocument = !!document.modelContext;
  const wrap = t => async (input) => {
    try { const r = await aiCall(t.name, input || {}, { via: 'webmcp', agent: 'browser agent' }); const text = JSON.stringify(r); return viaDocument ? text : { content: [{ type: 'text', text }] }; }
    catch (e) { const text = JSON.stringify({ error: aiErrorOut(e) }); return viaDocument ? text : { content: [{ type: 'text', text }], isError: true }; }

  $('#peers').before(btn);
  btn.addEventListener('click', () => aiToggle());
  const p = h('<div id="aiPanel" class="popover aipanel" hidden></div>'); document.body.appendChild(p);
  p.addEventListener('click', async e => {
    const t = e.target.closest('[data-aitab]'); if (t) { UI.aiTab = t.dataset.aitab; if (UI.aiTab === 'chat') RC.unread = 0; return rcRender(true); }
    const x = e.target.closest('[data-aiexp]'); if (x) return aiExport(x.dataset.aiexp, x.dataset.how);
    const a = e.target.closest('[data-ai]'); if (!a) return;
    switch (a.dataset.ai) {
      case 'close': p.hidden = true; updateAIButton(); break;
      case 'newroom': RC.room = newRoomName(); RC.fromLink = false; rcSettingsSave(); rcRender(true); break;
      case 'connect': readAIForm(); RC.fromLink = false; await rcConnect(); break;
      case 'disconnect': await rcDisconnect(); break;
      case 'copysnippet': toast(await copyText(snippetFor(RC.mode)) ? 'Copied' : 'Copy failed'); break;
      case 'copyprompt': toast(await copyText(agentPrompt()) ? 'Prompt copied — paste it to your agent' : 'Copy failed'); break;
      case 'copylink': { const u = location.href.split('#')[0] + `#ai-room=${encodeURIComponent(RC.room)}&ai-mode=${RC.mode}${RC.password !== PRESETS[RC.mode].password ? `&ai-pass=${encodeURIComponent(RC.password)}` : ''}`; toast(await copyText(u) ? 'Invite link copied (opens with the room filled in; it still needs a click to connect)' : 'Copy failed'); break; }
    }
  });
  p.addEventListener('change', e => {
    const d = e.target;
    if (d.dataset.sel === 'aiMode') { readAIForm(); RC.mode = d.value; if (PRESETS[RC.mode].password !== null) RC.password = PRESETS[RC.mode].password; rcSettingsSave(); rcRender(true); }
    if (d.dataset.sel === 'aiScope') { UI.aiScope = d.value; }
    if (d.id === 'aiEdits') { AI.readOnly = !d.checked; rcSettingsSave(); if (RC.sdk && RC.status === 'live') rcSend(envOut('skill_update', { skills: ['design', 'blueline', 'command', 'chat'], status: AI.readOnly ? 'read-only' : 'online', statusDetail: root().name, agent: rcProfile() })); }
    if (d.id === 'aiNotify') { RC.notifyEdits = d.checked; rcSettingsSave(); }
    if (d.id === 'aiEmbed') { RC.embedAllowed = d.checked; rcSettingsSave(); }
    if (['aiRoom', 'aiPass', 'aiSid'].includes(d.id)) { readAIForm(); rcSettingsSave(); const sn = $('#aiSnippet'); if (sn) sn.textContent = snippetFor(RC.mode); const pr = $('#aiPrompt'); if (pr) pr.textContent = agentPrompt(); }
  });
  p.addEventListener('submit', e => { e.preventDefault(); const i = $('#aiChatIn'); aiChatOut(i.value); i.value = ''; });
  p.addEventListener('keydown', e => { if (e.key === 'Escape') { p.hidden = true; updateAIButton(); } e.stopPropagation(); });
  p.addEventListener('focusout', () => setTimeout(() => { if (UI.aiStale && !p.contains(document.activeElement)) { UI.aiStale = false; rcRender(true); } }, 0));
  AI.listeners.push(() => { if (!p.hidden && UI.aiTab === 'chat') rcRender(); });
  aiRegisterWebMCP();
  updateAIButton();
  if (RC.fromLink) { UI.aiTab = 'connect'; p.hidden = false; rcRender(true); }
}
function readAIForm() { const r = $('#aiRoom'), pw = $('#aiPass'), s = $('#aiSid'); if (r) RC.room = r.value.trim(); if (pw) RC.password = pw.value.trim(); if (s) RC.streamId = s.value.trim() || 'blueline'; }

/* OfficeNinja navigation uses normal same-origin pages. No remote-control
   permissions or editor document formats are changed by this integration. */
function getSuiteTheme() {
  try {
    const theme = localStorage.getItem('officeninja_theme');
    if (theme === 'dark' || theme === 'light' || theme === 'system') return theme;
  } catch (e) { /* Fall back to Blueline's existing preference. */ }
  return safeLS.get('blueline:theme', 'system');
}

function applySuiteTheme(theme) {
  const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const button = $('#suiteTheme');
  if (button) {
    button.textContent = dark ? 'Light mode' : 'Dark mode';
    button.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
  }
}

function syncSuiteFileUrl() {
  if (!D.fileId) return;
  const url = new URL(location.href);
  url.searchParams.delete('new');
  url.searchParams.set('id', D.fileId);
  history.replaceState(null, '', url);
}

async function leaveForSuite(url) {
  endTextEdit(true);
  exitVecEdit(true);
  await saveNow();
  if (saveState !== 'saved' && !confirm('This design could not be saved. Leave anyway? Export a copy first to keep your work.')) return;
  location.assign(url);
}

function initSuiteNavigation() {
  const preference = getSuiteTheme;
  applySuiteTheme(preference());
  $('#suiteTheme').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
  window.addEventListener('storage', e => { if (e.key === 'officeninja_theme') applySuiteTheme(preference()); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applySuiteTheme(preference()));
  $('#suiteApp').addEventListener('change', async e => {
    const app = e.target.value;
    e.target.value = 'blueline';
    if (app !== 'blueline') await leaveForSuite('../#/' + app);
  });
  $('[data-suite-link]').addEventListener('click', e => {
    if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    leaveForSuite(e.currentTarget.href);
  });
}

if (document.readyState !== 'loading') { document.removeEventListener('DOMContentLoaded', init); init(); }
</script>
</body>
